services:
  adguardhome:
    image: adguard/adguardhome
    container_name: adguardhome
    hostname: adguardhome
    volumes:
      - ${ADGUARDHOME_CONF_FOLDER:-./data/config}:/opt/adguardhome/conf
      - ${ADGUARDHOME_WORK_FOLDER:-./data/work}:/opt/adguardhome/work
      - TZ:${TIMEZONE:-Etc/UTC}
    restart: unless-stopped
    ports:
      - '5443:5443/udp'
      - '5443:5443/tcp'
      - '8853:8853/udp'
      - '853:853/udp'
      - '784:784/udp'
      - '853:853/tcp'
      - '3000:3000/tcp'
      - '443:443/udp'
      - '443:443/tcp'
      - '8000:80/tcp'
      - '68:68/udp'
      - '67:67/udp'
      - '53:53/udp'
      - '53:53/tcp'
    networks:
      local:
        ipv4_address: 172.${SUBNET_NUMBER}.0.2

networks:
  local:
    ipam:
      config:
        - subnet: 172.${SUBNET_NUMBER}.0.0/16
          gateway: 172.${SUBNET_NUMBER}.0.1