services:
  adguardhome:
    image: adguard/adguardhome
    container_name: adguardhome
    hostname: adguardhome
    environment:
      - TZ=${TIMEZONE:-Etc/UTC}
    volumes:
      - ${ADGUARDHOME_CONF_FOLDER:-./data/config}:/opt/adguardhome/conf
      - ${ADGUARDHOME_WORK_FOLDER:-./data/work}:/opt/adguardhome/work
    restart: unless-stopped
    networks:
      external:
        ipv4_address: ${ADGUARDHOME_IP}

networks:
  external:
    external: true
    name: ${EXTERNAL_NETWORK_NAME}